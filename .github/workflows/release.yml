name: Release standalone binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies for every release target
        run: bun install --frozen-lockfile --cpu="*" --os="*"

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          tag_version="${RELEASE_VERSION#v}"
          package_version="$(bun -e 'import manifest from "./apps/lineater/package.json"; process.stdout.write(manifest.version)')"
          test "$tag_version" = "$package_version" || {
            echo "Tag version $tag_version does not match package version $package_version" >&2
            exit 1
          }

      - name: Audit dependencies
        run: bun audit

      - name: Lint and typecheck
        run: |
          bun run lint
          bun run typecheck

      - name: Build website
        run: bun run build:web

      - name: Test
        run: bun test

      - name: Test installer
        run: ./scripts/install.test.sh

      - name: Build release archives
        env:
          LINEATER_VERSION: ${{ github.ref_name }}
          LINEATER_RELEASE_LINEAR_CLIENT_ID: ${{ vars.LINEATER_LINEAR_CLIENT_ID }}
        run: |
          export LINEATER_VERSION="${LINEATER_VERSION#v}"
          ./scripts/build-release.sh

      - name: Smoke-test Linux x64 artifact
        run: |
          mkdir -p /tmp/lineater-smoke
          tar -xzf release/lineater-linux-x64.tar.gz -C /tmp/lineater-smoke
          /tmp/lineater-smoke/lineater --version | grep -Fx "${GITHUB_REF_NAME#v}"

      - name: Install Linux Secret Service for OAuth smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dbus-x11 gnome-keyring libsecret-tools

      - name: Smoke-test fresh-install OAuth
        env:
          LINEATER_RELEASE_LINEAR_CLIENT_ID: ${{ vars.LINEATER_LINEAR_CLIENT_ID }}
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            rm -rf "$HOME/.local/share/keyrings"
            eval "$(printf "lineater-ci\n" | gnome-keyring-daemon --daemonize --login --components=secrets)"
            for attempt in $(seq 1 10); do
              dbus-send --session --dest=org.freedesktop.DBus \
                --type=method_call --print-reply \
                /org/freedesktop/DBus org.freedesktop.DBus.ListNames 2>/dev/null \
                | grep -q org.freedesktop.secrets && break
              sleep 1
            done
            dbus-send --session --dest=org.freedesktop.DBus \
              --type=method_call --print-reply \
              /org/freedesktop/DBus org.freedesktop.DBus.ListNames \
              | grep -q org.freedesktop.secrets
            ./scripts/auth-install-smoke.sh /tmp/lineater-smoke/lineater "$LINEATER_RELEASE_LINEAR_CLIENT_ID"
          '

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release/*"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --notes-file CHANGELOG.md --title "Lineater $GITHUB_REF_NAME"
