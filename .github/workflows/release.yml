name: Release standalone binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies for every release target
        run: bun install --frozen-lockfile --cpu="*" --os="*"

      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          tag_version="${RELEASE_VERSION#v}"
          package_version="$(bun -e 'import manifest from "./apps/lineater/package.json"; process.stdout.write(manifest.version)')"
          test "$tag_version" = "$package_version" || {
            echo "Tag version $tag_version does not match package version $package_version" >&2
            exit 1
          }

      - name: Audit dependencies
        run: bun audit

      - name: Lint and typecheck
        run: |
          bun run lint
          bun run typecheck

      - name: Build website
        run: bun run build:web

      - name: Test
        run: bun test

      - name: Test installer
        run: ./scripts/install.test.sh

      - name: Build release archives
        env:
          LINEATER_VERSION: ${{ github.ref_name }}
        run: |
          export LINEATER_VERSION="${LINEATER_VERSION#v}"
          ./scripts/build-release.sh

      - name: Smoke-test Linux x64 artifact
        run: |
          mkdir -p /tmp/lineater-smoke
          tar -xzf release/lineater-linux-x64.tar.gz -C /tmp/lineater-smoke
          /tmp/lineater-smoke/lineater --version | grep -Fx "${GITHUB_REF_NAME#v}"

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release/*"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "Lineater $GITHUB_REF_NAME"
